<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tina Campbell — Ink bleed down</title>
  <link rel="stylesheet" href="../../_shared/chrome.css">
</head>
<body data-transition="01A-02A-A">
  <div class="grain" aria-hidden="true"></div>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="logo" href="/" aria-label="Tina Campbell Photography, home">
        <img src="../../_shared/brand/tcphoto-logo-white.png" alt="" width="584" height="415">
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="/work/">Work</a>
        <a href="/fashion-editorial/">Fashion & Editorial</a>
        <a href="/about/">About</a>
        <a href="/services/">Services</a>
        <a href="/journal/">Journal</a>
      </nav>
      <a class="btn site-header__cta" href="/book/">Book a shoot</a>
    </div>
  </header>
  <main>
    <div class="scroll-track" data-track>
      <div class="stage" data-stage>
        <section class="sec sec-out" data-out data-scene="01A">
      <div class="media">
        <video data-media autoplay muted loop playsinline poster="../../../01-home-hero/A-living-gown/end.jpg" src="../../../01-home-hero/A-living-gown/clip.mp4"></video>
      </div>
      <div class="copy copy--hero">
        <p class="kicker">Edmonton</p>
        <h1>Tina Campbell</h1>
        <p class="lede">Fashion, portrait and runway photography in Edmonton, Alberta.</p>
      </div>
        </section>
        <section class="sec sec-in" data-in data-scene="02A">
      <div class="media">
        <img data-media src="../../../02-home-filmstrip/A-film-gate-advance/start.jpg" alt="">
      </div>
      <div class="copy copy--hero">
        <p class="kicker">Home</p>
        <h1>The contact sheet</h1>
        <p class="lede">Work, fashion, portraits, bridal and the city, advancing one frame at a time.</p>
      </div>
        </section>
      <div class="ink-layer" data-ink aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <script src="../../_shared/gsap/gsap.min.js"></script>
  <script src="../../_shared/gsap/ScrollTrigger.min.js"></script>
  <script src="../../_shared/gsap/ScrollToPlugin.min.js"></script>
  <script src="../../_shared/gsap/SplitText.min.js"></script>
  <script src="../../_shared/gsap/DrawSVGPlugin.min.js"></script>
  <script src="../../_shared/gsap/CustomEase.min.js"></script>
  <script src="../../_shared/boot.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tina Campbell — City iris</title>
  <link rel="stylesheet" href="../../_shared/chrome.css">
</head>
<body data-transition="08B-09B-C">
  <div class="grain" aria-hidden="true"></div>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="logo" href="/" aria-label="Tina Campbell Photography, home">
        <img src="../../_shared/brand/tcphoto-logo-white.png" alt="" width="584" height="415">
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="/work/">Work</a>
        <a href="/fashion-editorial/" aria-current="page" data-nav-out>Fashion & Editorial</a>
        <a href="/about/" data-nav-in>About</a>
        <a href="/services/">Services</a>
        <a href="/journal/">Journal</a>
      </nav>
      <a class="btn site-header__cta" href="/book/">Book a shoot</a>
    </div>
  </header>
  <main>
    <div class="scroll-track" data-track>
      <div class="stage" data-stage>
        <section class="sec sec-out" data-out data-scene="08B">
      <div class="media">
        <img data-media src="../../../08-page-transitions/B-ink-flood/end.jpg" alt="">
      </div>
      <div class="copy copy--hero">
        <p class="kicker">Page</p>
        <h1>The next frame</h1>
        <p class="lede">Ink floods the page, and the next cover comes through.</p>
      </div>
        </section>
        <section class="sec sec-in" data-in data-scene="09B">
      <div class="media">
        <img data-layer data-media src="../../../09-about-parallax/B-blue-hour-lights/start.jpg" alt="">
        <img data-layer src="../../../09-about-parallax/B-blue-hour-lights/start.jpg" alt="" style="position:absolute;inset:0;opacity:.55;mix-blend-mode:screen;transform:scale(1.06)">
        <img data-layer src="../../../09-about-parallax/B-blue-hour-lights/start.jpg" alt="" style="position:absolute;inset:0;opacity:.35;transform:scale(1.12)">
      </div>
      <div class="copy copy--hero">
        <p class="kicker">Edmonton</p>
        <h1>About</h1>
        <p class="lede">Dusk turns to blue hour over the Walterdale arch.</p>
      </div>
        </section>

      </div>
    </div>
  </main>

  <script src="../../_shared/gsap/gsap.min.js"></script>
  <script src="../../_shared/gsap/ScrollTrigger.min.js"></script>
  <script src="../../_shared/gsap/ScrollToPlugin.min.js"></script>
  <script src="../../_shared/gsap/SplitText.min.js"></script>
  <script src="../../_shared/gsap/DrawSVGPlugin.min.js"></script>
  <script src="../../_shared/gsap/CustomEase.min.js"></script>
  <script src="../../_shared/boot.js"></script>
</body>
</html>
